<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>spaCy NER Tester</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
      textarea { width: 100%; min-height: 130px; }
      .controls { margin: 1rem 0; display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
      button { padding: 0.5rem 1rem; cursor: pointer; }
      .error { color: #b00020; margin-top: 0.5rem; }
      .result-box { border: 1px solid #ddd; border-radius: 6px; padding: 0.8rem; white-space: pre-wrap; line-height: 1.8; }
      .ent { padding: 0.05rem 0.2rem; border-radius: 4px; margin: 0 1px; display: inline-block; }
      .tag { font-size: 0.7rem; font-weight: bold; margin-left: 0.25rem; opacity: 0.8; }
      table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
      th, td { border: 1px solid #ddd; padding: 0.45rem; text-align: left; }
      th { background: #f5f5f5; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <h1>spaCy NER Tester</h1>
    <textarea id="textInput" placeholder="Type or paste text here...">Apple was founded by Steve Jobs in California on April 1, 1976.</textarea>
    <div class="controls">
      <label for="modelSelect">Model:</label>
      <select id="modelSelect">
        <option value="en_core_web_sm">en_core_web_sm</option>
        <option value="en_core_web_md">en_core_web_md</option>
        <option value="en_core_web_lg">en_core_web_lg</option>
      </select>
      <button id="extractBtn">Extract Entities</button>
      <span id="loading" class="hidden">Loading...</span>
    </div>
    <div id="error" class="error"></div>

    <h2>Highlighted Text</h2>
    <div id="highlightedText" class="result-box"></div>

    <h2>Entities</h2>
    <table>
      <thead>
        <tr>
          <th>Text</th>
          <th>Label</th>
          <th>Start</th>
          <th>End</th>
        </tr>
      </thead>
      <tbody id="entitiesBody"></tbody>
    </table>

    <script>
      const API_URL = "http://127.0.0.1:8000/extract-entities";
      const labelColors = {
        PERSON: "#b3d9ff",
        ORG: "#b7f0c2",
        GPE: "#ffd3a8",
        DATE: "#d5c5ff",
        LOC: "#ffe6a8",
      };

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function colorForLabel(label) {
        if (labelColors[label]) return labelColors[label];
        let hash = 0;
        for (let i = 0; i < label.length; i++) hash = ((hash << 5) - hash) + label.charCodeAt(i);
        const hue = Math.abs(hash) % 360;
        return `hsl(${hue} 80% 88%)`;
      }

      function renderHighlightedText(text, entities) {
        if (!entities.length) return escapeHtml(text);
        let html = "";
        let cursor = 0;
        for (const entity of entities) {
          html += escapeHtml(text.slice(cursor, entity.start_char));
          html += `<span class="ent" style="background:${colorForLabel(entity.label)}" title="${entity.label}">${escapeHtml(text.slice(entity.start_char, entity.end_char))}<span class="tag">${entity.label}</span></span>`;
          cursor = entity.end_char;
        }
        html += escapeHtml(text.slice(cursor));
        return html;
      }

      function renderTable(entities) {
        const body = document.getElementById("entitiesBody");
        body.innerHTML = entities.map((entity) => `
          <tr>
            <td>${escapeHtml(entity.text)}</td>
            <td>${escapeHtml(entity.label)}</td>
            <td>${entity.start_char}</td>
            <td>${entity.end_char}</td>
          </tr>
        `).join("");
      }

      async function extractEntities() {
        const text = document.getElementById("textInput").value;
        const model = document.getElementById("modelSelect").value;
        const loading = document.getElementById("loading");
        const error = document.getElementById("error");
        const highlightedText = document.getElementById("highlightedText");

        loading.classList.remove("hidden");
        error.textContent = "";

        try {
          const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text, model })
          });

          if (!response.ok) {
            const data = await response.json().catch(() => ({}));
            throw new Error(data.detail || "Unable to extract entities.");
          }

          const data = await response.json();
          highlightedText.innerHTML = renderHighlightedText(data.text, data.entities);
          renderTable(data.entities);
        } catch (e) {
          error.textContent = "Could not reach backend. Make sure FastAPI is running on http://127.0.0.1:8000.";
          highlightedText.textContent = "";
          document.getElementById("entitiesBody").innerHTML = "";
        } finally {
          loading.classList.add("hidden");
        }
      }

      document.getElementById("extractBtn").addEventListener("click", extractEntities);
      document.getElementById("highlightedText").textContent = "Run extraction to see highlighted entities.";
    </script>
  </body>
</html>
